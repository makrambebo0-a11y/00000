<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قراءة كتاب | نور الحياة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  #reader {
    --rd-bg:#f3f5fb; --rd-card:#fff; --rd-text:#1b2340; --rd-sub:#5b6585;
    --rd-from:#1e3a8a; --rd-to:#3b5bdb; --rd-gold:#d4a63a; --rd-shadow:0 8px 24px rgba(30,58,138,.12);
    display:block; min-height:100vh; padding:24px 16px 60px;
    background:var(--rd-bg); color:var(--rd-text);
    font-family:"Cairo",sans-serif; direction:rtl; transition:background .3s,color .3s;
  }
  #reader[data-theme="dark"] {
    --rd-bg:#0d1220; --rd-card:#161d33; --rd-text:#e8ecf8; --rd-sub:#a3adcc;
    --rd-from:#2a3f9e; --rd-to:#4a66e0; --rd-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  #reader *, #reader *::before, #reader *::after { box-sizing:border-box; }
  #reader .rd-wrap { max-width:820px; margin:0 auto; }

  #reader .rd-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  #reader .rd-tools { display:flex; gap:8px; }
  #reader .rd-btn {
    display:inline-flex; align-items:center; justify-content:center;
    height:44px; min-width:44px; padding:0 16px; border:none; border-radius:22px; cursor:pointer;
    background:var(--rd-card); color:var(--rd-text); box-shadow:var(--rd-shadow);
    font:600 15px "Cairo",sans-serif; text-decoration:none; transition:transform .2s;
  }
  #reader .rd-btn:hover { transform:translateY(-2px); }

  #reader .rd-card { display:block; background:var(--rd-card); border-radius:22px; box-shadow:var(--rd-shadow); overflow:hidden; }
  #reader .rd-title {
    margin:0; padding:26px 20px; text-align:center; color:#fff; font-size:28px; font-weight:900;
    background:linear-gradient(135deg, var(--rd-from), var(--rd-to)); border-bottom:4px solid var(--rd-gold);
  }
  #reader .rd-text {
    display:block; padding:28px; font-size:20px; line-height:2.1; white-space:pre-wrap;
    color:var(--rd-text); word-wrap:break-word;
  }
  #reader .rd-text.rd-missing { text-align:center; color:var(--rd-sub); }

  @media (max-width:520px) { #reader .rd-title { font-size:22px; } #reader .rd-text { padding:20px; } }
</style>
<script src="settings.js"></script>
</head>
<body style="margin:0">

<div id="reader" data-theme="light">
  <div class="rd-wrap">

    <div class="rd-bar">
      <a class="rd-btn" href="agpeya.html">→  الصفحة الرئيسية</a>
      <div class="rd-tools">
        <button class="rd-btn" id="rdPlus">أ +</button>
        <button class="rd-btn" id="rdMinus">أ −</button>
        <button class="rd-btn" id="rdTheme" title="الوضع الليلي">🌙</button>
      </div>
    </div>

    <div class="rd-card">
      <h1 class="rd-title" id="rdTitle"></h1>
      <div class="rd-text" id="rdText">جاري التحميل...</div>
    </div>

  </div>
</div>

<!-- ملف البيانات اللي بيطلع من build.py (لو مش موجود الصفحة بتقرا الـ txt مباشرة) -->
<script src="books-data.js"></script>

<script>
(function () {
  /* اسم كل كتاب ← بيتطابق مع b= في الرابط واسم ملف الـ txt */
  const NAMES = {
    "khulagy":           "الخولاجي المقدس",
    "agpeya":            "الأجبية",
    "qatmaros":          "القطمارس",
    "absalmodia-annual": "الإبصلمودية السنوية",
    "absalmodia-koiak":  "الإبصلمودية الكيهكية",
    "holy-week":         "دلال أسبوع الآلام",
    "sujood":            "صلاة السجدة",
    "qasm":              "صلوات القسم"
  };

  const id = new URLSearchParams(location.search).get("b") || "";
  const name = NAMES[id] || "كتاب غير معروف";
  const box = document.getElementById("rdText");

  document.getElementById("rdTitle").textContent = name;
  document.title = name + " | نور الحياة";

  function show(text) { box.classList.remove("rd-missing"); box.textContent = text; }
  function missing() {
    box.classList.add("rd-missing");
    box.textContent = "لم يتم إضافة نص هذا الكتاب بعد.\nضعي الملف books/" + id + ".txt ثم شغلي python build.py";
  }

  /* 1) من books-data.js  2) أو من ملف الـ txt مباشرة (مع Live Server أو بعد الرفع) */
  if (typeof BOOKS !== "undefined" && BOOKS[id]) {
    show(BOOKS[id]);
  } else {
    fetch("books/" + id + ".txt")
      .then(r => { if (!r.ok) throw new Error("404"); return r.text(); })
      .then(show)
      .catch(missing);
  }

  /* تكبير وتصغير الخط (يتحفظ) */
  let size = 20;
  try { size = parseInt(localStorage.getItem("rdSize")) || 20; } catch (e) {}
  function applySize() {
    box.style.fontSize = size + "px";
    try { localStorage.setItem("rdSize", size); } catch (e) {}
  }
  applySize();
  document.getElementById("rdPlus").onclick  = () => { size = Math.min(size + 2, 44); applySize(); };
  document.getElementById("rdMinus").onclick = () => { size = Math.max(size - 2, 14); applySize(); };

  /* الوضع الليلي */
  const root = document.getElementById("reader"), btn = document.getElementById("rdTheme");
  function setTheme(t) {
    root.dataset.theme = t; btn.textContent = t === "dark" ? "☀️" : "🌙";
    try { localStorage.setItem("theme", t); } catch (e) {}
  }
  let saved = null; try { saved = localStorage.getItem("theme"); } catch (e) {}
  setTheme(saved === "dark" ? "dark" : "light");
  btn.onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");
})();
</script>

</body>
</html>
